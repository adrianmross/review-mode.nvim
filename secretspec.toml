# Declarations only — no values. `secretspec` fronts keyring, Proton Pass,
# 1Password and the rest, so each machine keeps the release bot's credentials
# wherever it already keeps secrets. CI reads the repo secrets of the same name.
[project]
name = "review-mode.nvim"
revision = "1.0"

[profiles.default]
RELEASE_APP_ID = { description = "GitHub App id for the release bot", required = false }
RELEASE_APP_PRIVATE_KEY = { description = "GitHub App private key (PEM) for the release bot", required = false }
