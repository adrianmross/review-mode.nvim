name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# a new push to a PR supersedes the run on its old head; main keeps every run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use devenv cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Run validation
        run: devenv test --no-eval-cache

  # the suite on the oldest Neovim the plugin supports, the current release and
  # nightly (allowed to fail: an upstream break should not block a PR)
  neovim:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.11.0, stable, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # origin/main, so validate.sh's git diff --check covers the PR's commits
          fetch-depth: 0

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install StyLua
        env:
          STYLUA_VERSION: v2.1.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/$STYLUA_VERSION/stylua-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"

      - name: Run validation
        run: bash scripts/validate.sh

  release-intent:
    name: Release Intent
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch base
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Check changeset
        env:
          BASE_REF: "origin/${{ github.base_ref }}"
        run: bash scripts/changeset-check.sh
